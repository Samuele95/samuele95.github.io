---
layout: default
---

<article class="page">
  <div class="container container-narrow">

    <div class="qs-content">
      {{ content }}
    </div>

    {% if page.tags.size > 0 %}
    <div class="post__tags" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--bg-highlight, #292e42);">
      <strong>Tags:</strong>
      {% for tag in page.tags %}
      <a href="{{ '/blog/tag/' | append: tag | downcase | replace: ' ', '-' | relative_url }}" class="tag">{{ tag }}</a>
      {% endfor %}
    </div>
    {% endif %}

    <nav class="post__nav" style="display: flex; justify-content: space-between; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--bg-highlight, #292e42);">
      {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}" class="btn btn--secondary">
        &larr; {{ page.previous.title | truncate: 30 }}
      </a>
      {% else %}
      <span></span>
      {% endif %}
      {% if page.next %}
      <a href="{{ page.next.url | relative_url }}" class="btn btn--secondary">
        {{ page.next.title | truncate: 30 }} &rarr;
      </a>
      {% endif %}
    </nav>
  </div>
</article>
